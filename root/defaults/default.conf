server {
  listen 3000 default_server;
  listen [::]:3000 default_server;
  client_max_body_size 0;

  location / {
    root /app/frontend;
    index index.html;
    try_files $uri $uri/ /index.html;
    # Always revalidate (cheap 304 via ETag). Without this, browsers cache
    # app.js/style.css heuristically and keep running the old code after an
    # update. index.html additionally stamps them with ?v=<content hash>.
    add_header Cache-Control "no-cache" always;
  }

  location /api/ {
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_http_version      1.1;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_buffering         off;
    proxy_pass              http://127.0.0.1:8000/api/;
  }

  location /ws/ {
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        Host $host;
    proxy_http_version      1.1;
    proxy_read_timeout      3600s;
    proxy_buffering         off;
    proxy_pass              http://127.0.0.1:8000/ws/;
  }
}

server {
  listen 3001 ssl;
  listen [::]:3001 ssl;
  ssl_certificate           /config/ssl/cert.pem;
  ssl_certificate_key       /config/ssl/cert.key;
  client_max_body_size 0;

  location / {
